- name: app setup
  include_role:
   name: common
   tasks_from: app_setup

- name: nodejs setup
  include_role:
   name: common
   tasks_from: nodejs

- name: copy mongo repo file
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: installing client software
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present

- name: check products loaded or not if catalogue db exits or not
  ansible.builtin.command: mongosh --host mongodb.rojahanumantharaju.site --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: catalogue_output
  ignore_errors: true
  ignore_unrechable: true

- name: print catalogue_output
  ansible.builtin.debug:
    msg: "{{ catalogue_output }}"
  ignore_errors: true
  ignore_unrechable: true

# - name: load products if catalogue db doesnot exists
#   ansible.builtin.shell: mongosh --host mongodb.rojahanumantharaju.site < /app/db/master-data.js
#   when: catalogue_output.stdout | int < 0

# this tasks used to show the error handling just ignore this while exceuting catalogue
- name: load products if catalogue db doesnot exists
  ansible.builtin.shell: mongosh --host mongodb.rojahanumantharaju.site < /app/db/master-data.js
  when: catalogue_output.stdout | int < 0  
  ignore_errors: true # if we already know at this stage it is going to fail just use ignore error/unreachable soo task will not exit here it just skips
  ignore_unrechable: true

- name: systemd setup
  include_role:
   name: common
   tasks_from: systemd.yaml

- name: Deployment
  tags:
  - deployment
  include_role:
   name: common
   tasks_from: deployment