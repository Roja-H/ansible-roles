- name: nodejs setup
  include_role:
   name: common
   tasks_from: nodejs

- name: app setup
  include_role:
   name: common
   tasks_from: app_setup

- name: copy user service to system directory
  ansible.builtin.template:
    src: user.service.j2
    dest: /etc/systemd/system/user.service

- name: systemd setup
  include_role:
   name: common
   tasks_from: systemd.yaml